[package]
name = "super-ai"
version = "3.4.2"
description = "Super AI Codex and Antigravity local account manager"
authors = ["Talentisan"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "6"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
chrono = "0.4"
log = "0.4"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sysinfo = "0.37"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
url = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSRunningApplication"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
