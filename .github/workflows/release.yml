name: release

# 触发：
#   1. 推 v* tag（如 v0.1.0）—— 自动出 release（draft）
#   2. workflow_dispatch —— Actions 页面手动跑
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # 让 tauri-action 能创建 release 并上传产物

jobs:
  build:
    strategy:
      fail-fast: false
      # 四个目标平台并行：Mac 拆成 M 系列 (arm64) 与 Intel (x64) 两个独立 dmg；
      # Windows 用原生 windows-latest runner 出 nsis exe + msi，零交叉编译。
      matrix:
        include:
          - name: macOS arm64 (M series)
            os: macos-latest
            tauri_target: aarch64-apple-darwin
            sidecar_target: darwin-arm64
            rust_targets: aarch64-apple-darwin
          - name: macOS x64 (Intel)
            os: macos-latest
            tauri_target: x86_64-apple-darwin
            sidecar_target: darwin-x64
            rust_targets: x86_64-apple-darwin
          - name: Windows x64 (Intel)
            os: windows-latest
            tauri_target: x86_64-pc-windows-msvc
            sidecar_target: windows-x64
            rust_targets: x86_64-pc-windows-msvc

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Bun（编 sidecar 要 bun --compile）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 不同 target 的产物隔离，否则 mac/win 混存会反复重编
          key: ${{ matrix.tauri_target }}

      - name: Install npm deps
        run: npm ci

      # build-sidecar.sh 会：
      #   1. bun build --compile 把 vendor/windsurfapi 打成 superai-api-<triple>(.exe)
      #   2. 自动从 windsurf.com / GitHub Release 拉对应平台的 LS 二进制
      #      → 写到 src-tauri/binaries/language_server-<triple>(.exe)
      # tauri build 之后会被 externalBin 自动 bundle 进 dmg/exe/msi。
      - name: Build sidecar binaries
        shell: bash
        env:
          TARGET: ${{ matrix.sidecar_target }}
        run: bash scripts/build-sidecar.sh

      - name: Tauri build
        env:
          # public 构建：邮箱 / token 脱敏，UI 显示 SUPERAI-XXXXXXX。
          # 想发完全版改成不注入这一行，或者再加一个 release-full.yml。
          VITE_SUPERAI_PUBLIC_BUILD: "1"
          # 有 updater 私钥时打开（仓库 secret 里塞这两个就行）：
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec tauri -- build --target ${{ matrix.tauri_target }}
